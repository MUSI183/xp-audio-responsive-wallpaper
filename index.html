<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB}
.sky-base{position:absolute;z-index:0;left:0;top:0;width:100%;height:100%;background:#87CEEB}
.clouds-wrap{position:absolute;z-index:1;left:0;top:0;width:200%;height:100%;pointer-events:none;animation:cloudMove 240s linear infinite}
.clouds-wrap img{width:50%;height:100%;float:left;object-fit:cover;object-position:center top;opacity:0.85;-webkit-mask-image:linear-gradient(to right,transparent 0%,black 10%,black 90%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 10%,black 90%,transparent 100%);filter:blur(1px)}
@keyframes cloudMove{0%{margin-left:0}100%{margin-left:-50%}}
.big-char{position:absolute;z-index:2;pointer-events:none;transform-origin:center bottom}
#dj-beam{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;opacity:0;transition:opacity 0.6s ease}
#dj-beam.active{opacity:1}
#env-canvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none}
.hill-bg{position:absolute;z-index:2;left:0;top:0;width:100%;height:100%;background-image:url("hill_bg.png");background-repeat:no-repeat;background-position:center bottom;background-size:100% auto}
#doll-container{position:absolute;z-index:5;left:0;top:0;width:100%;height:100%;pointer-events:none}
.doll-item{position:absolute;transform-origin:center bottom}
.setting-toggle-btn{position:absolute;top:28px;right:28px;z-index:999;width:76px;height:76px;background:#222;color:#fff;border:2px solid #666;font-size:40px;cursor:pointer;display:none}
.setting-panel{display:none;position:absolute;top:118px;right:28px;z-index:998;width:640px;max-height:85vh;overflow-y:auto;background:#1a1a1a;color:#eee;padding:26px;border:2px solid #555}
.panel-title{font-size:30px;margin-bottom:20px;font-weight:bold;text-align:center}
.group-wrap{margin-bottom:20px;border:2px solid #444}
.group-header{padding:18px;background:#2c2c2c;font-size:24px;cursor:pointer;font-weight:bold}
.group-body{padding:18px;display:none}
.group-body.open{display:block}
.slider-row{margin:16px 0}
.slider-row label{display:block;font-size:22px;margin-bottom:8px}
.slider-row input[type=range]{width:100%;height:14px;cursor:pointer}
.slider-value-text{font-size:22px;color:#70d8ff;font-weight:bold;float:right}
.media-box{position:absolute;z-index:998;left:3vw;top:80vh;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);border-radius:14px;backdrop-filter:blur(10px);cursor:pointer;transform-origin:left top;opacity:0;pointer-events:none;transition:opacity 0.45s ease}
.media-box.visible{opacity:1;pointer-events:auto}
.media-cover{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#333;flex-shrink:0}
.media-title{font-size:15px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.media-artist{font-size:12px;color:rgba(255,255,255,0.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;margin-top:2px}
.media-progress{height:4px;background:rgba(255,255,255,0.18);border-radius:2px;margin-top:8px;overflow:hidden}
.media-progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#70d8ff,#a78bfa);border-radius:2px;transition:width 0.3s linear}
</style>
</head>
<body>
<div class="sky-base"></div>
<div class="clouds-wrap"><img src="clouds.png"><img src="clouds.png"></div>
<img class="big-char" src="big_doll.png">
<canvas id="dj-beam"></canvas>
<div class="hill-bg" id="hillBg"></div>
<canvas id="env-canvas"></canvas>
<div id="doll-container"></div>
<div id="media-box" class="media-box" title="单击播放/暂停">
<img id="media-cover" class="media-cover" src="" alt="">
<div class="media-info">
<div id="media-title" class="media-title">--</div>
<div id="media-artist" class="media-artist">--</div>
<div class="media-progress"><div id="media-progress-bar" class="media-progress-bar"></div></div>
</div></div>

function drawDiscoBall(){if(!djCtx||!djBeam.enabled)return;extractCoverColor();const w=djCanvas.width,h=djCanvas.height;djCtx.clearRect(0,0,w,h);let rawVol=0;for(let i=0;i<8;i++)rawVol+=(audioData[i]||0);rawVol/=8;if(rawVol<(djBeam.noiseThreshold||0.02))rawVol=0;let vol=Math.min(1,rawVol*(djBeam.sensitivity||1.5)*djBeam.intensity);const minB=djBeam.minBrightness||0;if(vol<minB)vol=minB;let bass=0;for(let i=0;i<3;i++)bass+=(audioData[i]||0);bass/=3;if(bass<(djBeam.noiseThreshold||0.02))bass=0;bass=Math.min(1,bass*(djBeam.sensitivity||1.5)*djBeam.intensity*1.2);const pulse=djBeam.bassPulse?(1+bass*0.25):1;discoBall.cx=w*(djBeam.ballPosX/100);discoBall.cy=h*(djBeam.ballPosY/100);const groundY=h*(djBeam.groundLevel/100);const rotSpeed=(djBeam.rotSpeed||1.0)*0.008;discoBall.rotY+=rotSpeed+vol*0.02;discoBall.rotX=Math.sin(performance.now()*0.0004)*0.15;const cosY=Math.cos(discoBall.rotY),sinY=Math.sin(discoBall.rotY);const cosX=Math.cos(discoBall.rotX),sinX=Math.sin(discoBall.rotX);const focal=discoBall.focal;const ballRadius=discoBall.radius*(djBeam.ballSize||1.0)*pulse;const time=performance.now();const tiles=[];for(let t=0;t<discoBall.tiles.length;t++){const tile=discoBall.tiles[t];const bs=djBeam.ballSize||1.0;const x1=tile.bx*bs*pulse*cosY+tile.bz*bs*pulse*sinY;const z1=-tile.bx*bs*pulse*sinY+tile.bz*bs*pulse*cosY;const y1=tile.by*bs*pulse;const y2=y1*cosX-z1*sinX;const z2=y1*sinX+z1*cosX;const x2=x1;const len=Math.sqrt(x2*x2+y2*y2+z2*z2)||1;const nx=x2/len,ny=y2/len,nz=z2/len;const scale=focal/(focal+z2);const sx=discoBall.cx+x2*scale;const sy=discoBall.cy+y2*scale;const gx=discoBall.cx+nx*(w*0.35)*(djBeam.spotSpread||1.0);const gy=groundY;let flick=1.0;if(djBeam.flicker){const seed=Math.sin(t*12.9898+time*0.003)*43758.5453;flick=0.6+(seed-Math.floor(seed))*0.8}const noiseSeed=Math.sin(t*78.233+time*0.0015)*43758.5453;const activity=noiseSeed-Math.floor(noiseSeed);const beamActive=ny>0.05&&nz>0&&activity<(djBeam.beamDensity||0.3);const perspective=Math.max(0.15,nz);const stretchX=1.0/perspective;const stretchY=perspective;tiles.push({x:x2,y:y2,z:z2,nx,ny,nz,sx,sy,gx,gy,hue:tile.hue,scale,flick,beamActive,stretchX,stretchY})}
if(djBeam.showBeams){for(let t=0;t<tiles.length;t++){const r=tiles[t];if(!r.beamActive)continue;const brightness=Math.min(1,0.15+vol*0.35+r.nz*0.1)*r.flick;if(brightness<0.05)continue;let hue=r.hue;if(djBeam.colorMode===1)hue=(t*30+discoBall.rotY*40)%360;else if(djBeam.colorMode===2)hue=220+Math.sin(t)*30;else if(djBeam.colorMode===3)hue=25+Math.sin(t)*20;else if(djBeam.colorMode===4)hue=(coverHue+r.hue*0.3)%360;const[cr,cg,cb]=hslToRgb(hue,95,60);const dx=r.gx-r.sx,dy=r.gy-r.sy;const dlen=Math.sqrt(dx*dx+dy*dy)||1;const px=-dy/dlen,py=dx/dlen;const topW=2+vol*4;const botW=(10+vol*20)*(djBeam.spotSize||1.0)*r.stretchX*0.5;djCtx.fillStyle=`rgba(${cr},${cg},${cb},${brightness*(djBeam.beamAlpha||0.15)})`;djCtx.beginPath();djCtx.moveTo(r.sx-px*topW/2,r.sy-py*topW/2);djCtx.lineTo(r.sx+px*topW/2,r.sy+py*topW/2);djCtx.lineTo(r.gx+px*botW/2,r.gy+py*botW/2);djCtx.lineTo(r.gx-px*botW/2,r.gy-py*botW/2);djCtx.closePath();djCtx.fill()}}
for(let t=0;t<tiles.length;t++){const r=tiles[t];if(!r.beamActive)continue;if(r.gx<-200||r.gx>w+200)continue;const dx=r.gx-r.sx,dy=r.gy-r.sy;const ellipseAngle=Math.atan2(dy,dx);const breathe=1+Math.sin(time*0.002+t*0.5)*0.15+bass*0.3;const baseSize=(10+vol*22)*(djBeam.spotSize||1.0)*breathe;const rx=baseSize*r.stretchX*0.8;const ry=baseSize*r.stretchY*0.9;const brightness=Math.min(1,0.4+vol*0.6+r.nz*0.15)*r.flick;let hue=r.hue;if(djBeam.colorMode===1)hue=(t*30+discoBall.rotY*40)%360;else if(djBeam.colorMode===2)hue=220+Math.sin(t)*30;else if(djBeam.colorMode===3)hue=25+Math.sin(t)*20;else if(djBeam.colorMode===4)hue=(coverHue+r.hue*0.3)%360;const[cr,cg,cb]=hslToRgb(hue,95,60);djCtx.save();djCtx.translate(r.gx,r.gy);djCtx.rotate(ellipseAngle);const grad=djCtx.createRadialGradient(0,0,0,0,0,Math.max(rx,ry));grad.addColorStop(0,`rgba(${cr},${cg},${cb},${0.75*brightness*(djBeam.spotAlpha||1.0)})`);grad.addColorStop(0.4,`rgba(${cr},${cg},${cb},${0.35*brightness*(djBeam.spotAlpha||1.0)})`);grad.addColorStop(1,`rgba(${cr},${cg},${cb},0)`);djCtx.fillStyle=grad;djCtx.beginPath();djCtx.ellipse(0,0,rx,ry,0,0,Math.PI*2);djCtx.fill();djCtx.restore()}
